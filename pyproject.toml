[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xbyj"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "rich>=13.0",
]

[project.scripts]
xbyj = "xiaobeiyangji:main"

[tool.setuptools]
py-modules = ["xiaobeiyangji"]
